# Modified by NooviCrew. This file was changed from the upstream WAHA work (Apache License, Version 2.0, section 4(b)).
# Tests for the NooviCrew branch. Upstream leaves this job commented out in
# .github/workflows/dev.yaml; the command is the one that file and package.json
# already name: yarn test:unit (package.json "test" is that script).

name: noovicrew

on:
  push:
    branches:
      - noovicrew/2026.9.1

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Unit tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Install dependencies
        run: |
          unset GIT_CONFIG_PARAMETERS
          yarn install --immutable

      - name: Run unit tests
        run: yarn test:unit

  scan:
    runs-on: ubuntu-latest
    name: Vulnerability and secret scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan this branch
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-out"
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/trivy-out:/out" \
            aquasec/trivy:0.66.0 \
            --version
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/trivy-out:/out" \
            aquasec/trivy:0.66.0 \
            fs --scanners vuln --exit-code 0 --format json --output /out/branch-vuln.json /src
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/trivy-out:/out" \
            aquasec/trivy:0.66.0 \
            fs --scanners secret --exit-code 0 --format json --output /out/branch-secrets.json /src
          python3 - "$RUNNER_TEMP/trivy-out" <<'PY'
          import json
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])

          def counts(path):
              data = json.loads(path.read_text())
              vulns = {}
              secrets = 0
              for result in data.get("Results") or []:
                  for vuln in result.get("Vulnerabilities") or []:
                      severity = vuln.get("Severity", "UNKNOWN")
                      vulns[severity] = vulns.get(severity, 0) + 1
                  secrets += len(result.get("Secrets") or [])
              return vulns, secrets

          vuln_counts, _ = counts(out / "branch-vuln.json")
          _, secret_count = counts(out / "branch-secrets.json")
          print(f"trivy fs vuln findings={vuln_counts}")
          print(f"trivy fs secret findings={secret_count}")
          PY
